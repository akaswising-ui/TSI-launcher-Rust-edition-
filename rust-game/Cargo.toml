[package]
name = "tsi-rust-game"
version = "0.1.0"
edition = "2024"
publish = false
description = "TSI Rust Edition, an independent Rust-native 3D voxel sandbox"

[dependencies]
macroquad = "=0.4.16"

[package.metadata.android]
package_name = "com.tsi.rustedition"
label = "TSI Rust Edition"
android_version = 35
target_sdk_version = 35
min_sdk_version = 28
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "landscape"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
