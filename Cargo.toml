[package]
name = "tsi-launcher-rust-edition"
version = "0.1.0"
edition = "2024"
publish = false
description = "Independent Rust-native Android launcher shell for TSI"

[lib]
name = "tsi_orbit"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tsi-orbit"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["persistence", "android-native-activity", "default_fonts", "wgpu", "clipboard", "links", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
pollster = "1.0"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"
winit = { version = "0.30.13", features = ["android-native-activity"] }

[package.metadata.android]
package = "com.tsi.orbit"
build_targets = ["aarch64-linux-android"]
apk_name = "TSI-Orbit-Rust"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 36

[package.metadata.android.application]
label = "TSI Orbit"
debuggable = true
theme = "@android:style/Theme.Material.NoActionBar"

[package.metadata.android.application.activity]
name = "android.app.NativeActivity"
label = "TSI Orbit"
orientation = "landscape"
launch_mode = "singleTop"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "tsi_orbit"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
