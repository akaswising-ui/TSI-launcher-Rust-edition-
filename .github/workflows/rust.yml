name: TSI Orbit and Rust Edition CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsi-orbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust formatting, compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format launcher sources
        run: cargo fmt --all
      - name: Check launcher
        run: cargo check --all-targets
      - name: Test launcher
        run: cargo test --all-targets
      - name: Clippy launcher
        run: cargo clippy --all-targets -- -D warnings
      - name: Format and check game source
        run: |
          cargo fmt --manifest-path rust-game/Cargo.toml --all
          cargo check --manifest-path rust-game/Cargo.toml --all-targets
      - name: Test Rust game world logic
        run: cargo test --manifest-path rust-game/Cargo.toml --all-targets

  android-launcher-arm64:
    name: TSI Orbit launcher ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865"
      - uses: Swatinem/rust-cache@v2
      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0
      - name: Build TSI Orbit ARM64 APK
        run: bash scripts/build-android.sh
      - name: Verify launcher APK
        run: |
          APK="build/TSI-Orbit-Rust-ARM64.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libtsi_orbit.so$'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.tsi.orbit'"
      - uses: actions/upload-artifact@v4
        with:
          name: TSI-Orbit-Rust-ARM64
          path: build/TSI-Orbit-Rust-ARM64.apk
          if-no-files-found: error
          retention-days: 90

  android-game-arm64:
    name: TSI Rust Edition playable game ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95 toolchain for cargo-quad-apk
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-game -> rust-game/target
      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Install Macroquad Android packager
        run: cargo +1.95.0 install --git https://github.com/hoklims/cargo-quad-apk cargo-quad-apk --locked
      - name: Build TSI Rust Edition game APK
        working-directory: rust-game
        run: cargo +1.95.0 quad-apk build --release
      - name: Verify standalone Rust game APK
        shell: bash
        run: |
          APK="$(find rust-game/target/android-artifacts/release/apk -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/.*\.so$'
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.tsi.rustedition'"
          if unzip -Z1 "$APK" | grep -Eiq 'horizon\.zip|jre-[0-9]+\.zip'; then
            echo "Java Edition runtime payload found in Rust Edition APK." >&2
            exit 1
          fi
          mkdir -p build
          cp "$APK" build/TSI-Rust-Edition-ARM64.apk
          echo "Verified native Rust game APK: build/TSI-Rust-Edition-ARM64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TSI-Rust-Edition-ARM64
          path: build/TSI-Rust-Edition-ARM64.apk
          if-no-files-found: error
          retention-days: 90
